services:
  - type: web
    name: orderi-bridge
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build:bridge
    startCommand: npm run start:bridge
    healthCheckPath: /api/bridge/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_BRIDGE_STATE_DIR
        value: /tmp/whatsapp-bridge
      - key: WHATSAPP_BRIDGE_STORAGE_BUCKET
        value: orderi-bridge-state
      - key: WHATSAPP_BRIDGE_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
