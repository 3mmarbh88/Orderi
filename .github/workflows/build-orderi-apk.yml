name: Build Orderi APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/build-orderi-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/build-orderi-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (including Git LFS files)
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Download and verify Gemma 3 1B IT model
        env:
          MODEL_URL: https://huggingface.co/cuesetac/gemma-3-1b-it-litertlm/resolve/main/Gemma3-1B-IT_multi-prefill-seq_q4_ekv4096.litertlm
          MODEL_SHA256: 1325ae366d31950f137c9c357b9fa89448b176d76998180c08ceaca78bba98be
        run: |
          set -euo pipefail
          MODEL_DIR=android/app/src/main/assets/models
          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 5 --retry-all-errors "$MODEL_URL" -o "$MODEL_DIR/gemma3-1b-it-int4.litertlm"
          echo "$MODEL_SHA256  $MODEL_DIR/gemma3-1b-it-int4.litertlm" | sha256sum --check -
          test "$(stat -c%s "$MODEL_DIR/gemma3-1b-it-int4.litertlm")" -eq 584417280
          printf '%s\n' 'Gemma is provided under and subject to the Gemma Terms of Use found at ai.google.dev/gemma/terms' > "$MODEL_DIR/NOTICE"
          curl --fail --location --retry 3 https://ai.google.dev/gemma/terms -o "$MODEL_DIR/GEMMA-TERMS.html"
          curl --fail --location --retry 3 https://ai.google.dev/gemma/prohibited_use_policy -o "$MODEL_DIR/GEMMA-PROHIBITED-USE-POLICY.html"
          printf '%s\n' 'Model source: https://huggingface.co/cuesetac/gemma-3-1b-it-litertlm' 'SHA-256: 1325ae366d31950f137c9c357b9fa89448b176d76998180c08ceaca78bba98be' 'Model: Gemma 3 1B IT, int4, 4096 context' > "$MODEL_DIR/MODEL-LICENSE-INFO.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orderi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
